<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart | Premium Groceries</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- CSS -->
     <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <nav>
        <div class="container nav-inner">
            <div class="logo">FreshMart</div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="#shop">Shop</a>
                <a href="#categories">Categories</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    <!-- HEADER AREA -->
     <header class="hero">
        <div class="container hero-box">
            <img src="./image/hero-image.jpg">
            <div class="hero-content">
                <h1>Fresh Groceries Delivered Daily</h1>
                <p>Premium farm-sourced produce and essentials at unbeatable prices.</p>
                <a href="#shop" class="btn-primary">Shop Now</a>
            </div>
        </div>
     </header>

     <!-- CATEGORIES SECTION -->
      <section id="categories">
        <div class="container">
            <h2 class="section-title">Shop by Category</h2>
            <div class="categories-grid">
                <div class="category-card">Vegetables</div>
                <div class="category-card">Fruits</div>
                <div class="category-card">Dairy</div>
                <div class="category-card">Meat</div>
                <div class="category-card">Bakery</div>
                <div class="category-card">Beverages</div>
            </div>
        </div>
      </section>

      



</body>

</html>
